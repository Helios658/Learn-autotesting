stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  CI: "true"
  TEST_BASE_URL: "https://gamma.hi-tech.org"
  HEADLESS_MODE: "true"

cache:
  paths:
    - .cache/pip

.e2e_job_template:
  stage: test
  image: mcr.microsoft.com/playwright/python:v1.55.0-jammy
  tags:
    - docker_last
  before_script:
    - pip install -r requirements.txt
    - python -m pip install --upgrade "playwright==1.55.0"
    - rm -rf allure-results
    - mkdir -p allure-results
    - |
      cat > allure-results/environment.properties <<EOF
      ENV=CI
      BASE_URL=${TEST_BASE_URL}
      HEADLESS=${HEADLESS_MODE}
      BROWSER=chromium
      EOF
    - |
      cat > allure-results/executor.json <<EOF
      {
        "name": "GitLab CI",
        "type": "gitlab",
        "url": "${CI_PROJECT_URL}",
        "buildOrder": "${CI_PIPELINE_ID}",
        "buildName": "${CI_JOB_NAME}",
        "buildUrl": "${CI_PIPELINE_URL}",
        "reportName": "UI E2E"
      }
      EOF
  script:
    - |
      TEST_EXIT=0
      PYTEST_CMD="pytest -v --headless --junitxml=report.xml --alluredir=allure-results ${PYTEST_TARGETS}"

      if [ -n "${ALLURE_ENDPOINT}" ] && [ -n "${ALLURE_TOKEN}" ] && [ -n "${ALLURE_PROJECT_ID}" ]; then
        curl -sSL https://github.com/allure-framework/allurectl/releases/latest/download/allurectl_linux_amd64 -o /usr/local/bin/allurectl
        chmod +x /usr/local/bin/allurectl

        export ALLURE_RESULTS=allure-results
        export ALLURE_LAUNCH_AUTO_CLOSE=true

        set -o pipefail
        allurectl watch -- bash -lc "${PYTEST_CMD}" 2>&1 | tee allure_watch.log
        TEST_EXIT=${PIPESTATUS[0]}

        LAUNCH_ID=$(sed -n 's/.*Launch \[\([0-9]\+\)\].*/\1/p' allure_watch.log | tail -n1)
        if [ -n "${LAUNCH_ID}" ]; then
          echo "Detected Launch ID: ${LAUNCH_ID}"
        fi

        if [ -n "${LAUNCH_ID}" ]; then
          allurectl launch close "${LAUNCH_ID}" || true
        else
          echo "Launch ID is empty, skip explicit close"
        fi
      else
        echo "ALLURE_ENDPOINT/ALLURE_TOKEN/ALLURE_PROJECT_ID not set -> run pytest without TestOps upload"
        bash -lc "${PYTEST_CMD}" || TEST_EXIT=$?
      fi

      exit $TEST_EXIT
  after_script:
    - echo "Tests finished"
  artifacts:
    when: always
    reports:
      junit: report.xml
    paths:
      - report.xml
      - allure-results/
      - artifacts/

full_e2e_tests:
  extends: .e2e_job_template
  variables:
    PYTEST_TARGETS: ""

focused_debug_tests:
  extends: .e2e_job_template
  variables:
    PYTEST_TARGETS: "tests/test_chat.py::test_30_create_or_open_p2p_chat_with_test_user2 tests/test_links.py::test_23_link_for_the_invited"
  rules:
    - when: manual
      allow_failure: true